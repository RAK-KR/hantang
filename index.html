<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한탕 (HANTANG)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="cross"></div>
    <div id="keys"></div>
    <div id="toast"></div>
    <div id="bubbles"></div>
    <div id="icons"></div>
    <div id="obj"></div>
    <div id="alarm"></div>
    <div id="radio"></div>
    <div id="prompt"><span></span><div class="bar"><i></i></div></div>
    <div id="hp"><span>체력</span><div class="bar"><i></i></div></div>
    <div id="vis"><span></span><div class="bar"><i></i></div></div>
  </div>
  <div id="dmg"></div>
  <div id="result"></div>

  <div id="wheel"></div>
  <div id="menu"></div>

  <div id="start">
    <div class="title">
      <h1>한탕</h1>
      <p class="sub">HANTANG · 든든은행 금정지점</p>
      <p class="blink">클릭해서 시작</p>
      <p class="hint">밤의 든든은행. 카드키를 찾고, 금고를 열고, 돈가방을 챙겨서 빠져나와라.</p>
      <p class="hint">Ctrl 앉기 · E 꾹 상호작용 · 뒤에서 E 기절 · Shift 달리면 시끄러움</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
