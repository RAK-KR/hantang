<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한탕 (HANTANG)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="cross"></div>
    <div id="keys"></div>
    <div id="toast"></div>
    <div id="bubbles"></div>
  </div>

  <div id="wheel"></div>
  <div id="menu"></div>

  <div id="start">
    <div class="title">
      <h1>한탕</h1>
      <p class="sub">HANTANG · 든든은행 금정지점</p>
      <p class="blink">클릭해서 시작</p>
      <p class="hint">F 칼 펼치기 · R 트릭 · 6 콤보 · G 꾹 눌러 감정표현 · V 3인칭</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
